name: Build Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      - name: Build web app
        env:
          VITE_AUTH_URL: ${{ secrets.VITE_AUTH_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CHAT_URL: ${{ secrets.VITE_CHAT_URL }}
          VITE_TTS_API_KEY: ${{ secrets.VITE_TTS_API_KEY }}
        run: npm run build

      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== OIDC Token Claims ==="
          echo "$IDTOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, repository_owner, ref, workflow}'
          echo "========================="
          echo "AWS_ROLE_ARN (masked by GitHub): ${{ secrets.AWS_ROLE_ARN }}"

